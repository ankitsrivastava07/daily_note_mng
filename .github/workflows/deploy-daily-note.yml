name: Deploy Daily Note

on:
  push:
    branches:
      - main
    paths:
      - "daily_note/**"
      - ".github/workflows/deploy-daily-note.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build Spring Boot application
        working-directory: daily_note
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ECR_ACCESSKEY }}
          aws-secret-access-key: ${{ secrets.AWS_ECR_SECRET_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build --no-cache \
            -f daily_note/Dockerfile \
            -t dailynote:latest \
            daily_note

      - name: Tag Docker image
        env:
          ECR_REGISTRY: 446394402725.dkr.ecr.ap-south-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag dailynote:latest \
            "$ECR_REGISTRY/dailynote:$IMAGE_TAG"

      - name: Push Docker image
        env:
          ECR_REGISTRY: 446394402725.dkr.ecr.ap-south-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$ECR_REGISTRY/dailynote:$IMAGE_TAG"

      - name: Deploy to AWS Lambda
        env:
          ECR_REGISTRY: 446394402725.dkr.ecr.ap-south-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws lambda update-function-code \
            --function-name daily_note_app \
            --image-uri "$ECR_REGISTRY/dailynote:$IMAGE_TAG" \
            --region ap-south-1

      - name: Wait for Lambda deployment
        run: |
          aws lambda wait function-updated \
            --function-name daily_note_app \
            --region ap-south-1

      - name: Verify deployed image
        env:
          ECR_REGISTRY: 446394402725.dkr.ecr.ap-south-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          DEPLOYED_IMAGE=$(aws lambda get-function \
            --function-name daily_note_app \
            --region ap-south-1 \
            --query 'Code.ResolvedImageUri' \
            --output text)

          echo "Deployed image: $DEPLOYED_IMAGE"

          case "$DEPLOYED_IMAGE" in
            "$ECR_REGISTRY/dailynote:$IMAGE_TAG"*)
              echo "Lambda image verification successful."
              ;;
            *)
              echo "ERROR: Deployed Lambda image does not match this commit."
              exit 1
              ;;
          esac