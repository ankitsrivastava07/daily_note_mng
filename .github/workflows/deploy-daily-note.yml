      - name: Verify deployed image
        env:
          ECR_REGISTRY: 446394402725.dkr.ecr.ap-south-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          EXPECTED_DIGEST=$(aws ecr describe-images \
            --repository-name dailynote \
            --image-ids imageTag="$IMAGE_TAG" \
            --region ap-south-1 \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          DEPLOYED_DIGEST=$(aws lambda get-function \
            --function-name daily_note_app \
            --region ap-south-1 \
            --query 'Code.ResolvedImageUri' \
            --output text | awk -F'@' '{print $2}')

          echo "Expected digest: $EXPECTED_DIGEST"
          echo "Deployed digest: $DEPLOYED_DIGEST"

          if [ "$EXPECTED_DIGEST" = "$DEPLOYED_DIGEST" ]; then
            echo "Lambda image verification successful."
          else
            echo "ERROR: Lambda image digest does not match the pushed image."
            exit 1
          fi