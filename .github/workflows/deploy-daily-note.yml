REGION="ap-south-1"
REPO="dailynote"
FUNCTION="daily_note_app"

# Get image currently deployed in Lambda
DEPLOYED_URI=$(aws lambda get-function \
  --function-name "$FUNCTION" \
  --region "$REGION" \
  --query 'Code.ResolvedImageUri' \
  --output text)

KEEP_DIGEST="${DEPLOYED_URI##*@}"

echo "Keeping Lambda image: $KEEP_DIGEST"

# Find all other images
OLD_IMAGES=$(aws ecr list-images \
  --repository-name "$REPO" \
  --region "$REGION" \
  --filter tagStatus=ANY \
  --output json | jq -c \
  --arg digest "$KEEP_DIGEST" \
  '[.imageIds[]
    | select(.imageDigest != $digest)
    | {imageDigest: .imageDigest}]
    | unique_by(.imageDigest)')

# Delete old images
if [ "$OLD_IMAGES" != "[]" ]; then
  aws ecr batch-delete-image \
    --repository-name "$REPO" \
    --region "$REGION" \
    --image-ids "$OLD_IMAGES"
fi

# Verify
aws ecr describe-images \
  --repository-name "$REPO" \
  --region "$REGION" \
  --query 'length(imageDetails)' \
  --output text
