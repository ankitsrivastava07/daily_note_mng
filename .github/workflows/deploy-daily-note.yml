      - name: Tag Docker image
        env:
          ECR_REGISTRY: 446394402725.dkr.ecr.ap-south-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag dailynote:latest \
            $ECR_REGISTRY/dailynote:$IMAGE_TAG

      - name: Push Docker image
        env:
          ECR_REGISTRY: 446394402725.dkr.ecr.ap-south-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/dailynote:$IMAGE_TAG

      - name: Deploy to AWS Lambda
        env:
          AWS_REGION: ap-south-1
          LAMBDA_FUNCTION: daily_note_app
          ECR_REGISTRY: 446394402725.dkr.ecr.ap-south-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --image-uri "$ECR_REGISTRY/dailynote:$IMAGE_TAG" \
            --region "$AWS_REGION"

      - name: Wait for Lambda deployment
        run: |
          aws lambda wait function-updated \
            --function-name daily_note_app \
            --region ap-south-1

      - name: Verify deployed image
        run: |
          aws lambda get-function \
            --function-name daily_note_app \
            --region ap-south-1 \
            --query 'Code.ResolvedImageUri' \
            --output text
