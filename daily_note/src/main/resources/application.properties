spring.application.name=note-app
# 1. AWS Lambda Web Adapter expects port 8080 (or ${PORT:8080})
server.port=9091
# 2. Fast Shutdown setting for Lambda execution context
server.shutdown=immediate
# 3. AWS Configuration
spring.cloud.aws.region.static=ap-south-1
spring.cloud.aws.secretsmanager.region=ap-south-1
spring.config.import=aws-secretsmanager:daily_note_secret_manager
# Optional Secrets Manager Import (Keep commented or optional)
# spring.config.import=optional:aws-secretsmanager:daily_note_secret_manager
# 4. Startup Optimization
spring.main.lazy-initialization=true
# 5. S3 Bucket Configuration
aws.s3.bucket-name=daily-note-document
aws.s3.region=ap-south-1
# 6. Optimized Logging for Lambda (Reduce log overhead during cold start)
logging.level.root=INFO
logging.level.com.daily_notes=DEBUG
logging.level.org.springframework.web=INFO
logging.level.software.amazon.awssdk=WARN
spring.jmx.enabled=false
spring.main.banner-mode=off
# Scheduling Configuration
outbox.scheduler.enabled=${outbox.scheduler.enabled}
