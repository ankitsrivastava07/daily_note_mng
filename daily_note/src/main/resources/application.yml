resilience4j:
  # Strategy 1: Semaphore Bulkhead
  bulkhead:
    instances:
      paymentServiceSemaphore:
        maxConcurrentCalls: 10          # Maximum simultaneous calls allowed
        maxWaitDuration: 200ms          # Time a thread will wait for a slot before failing

  # Strategy 2: Thread Pool Bulkhead
  threadpoolbulkhead:
    instances:
      paymentServiceThreadPool:
        maxThreadPoolSize: 8            # Maximum threads in the pool
        coreThreadPoolSize: 4           # Keep-alive base threads
        queueCapacity: 20               # Tasks waiting in line before rejection
        keepAliveDuration: 1000ms       # Thread idle lifetime
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: |
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="${KAFKA_USERNAME}"
        password="${KAFKA_PASSWORD}";

      ssl.truststore.location: ${KAFKA_CA_PATH:classpath:kafka-ca.pem}
      ssl.truststore.type: PEM

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer