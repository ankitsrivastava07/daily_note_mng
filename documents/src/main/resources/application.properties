spring.application.name=documents
server.port=9095
# AWS Region
aws.s3.region=${AWS_S3_REGION:ap-south-1}
# S3 Bucket
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:daily-note-dms}
# AWS credentials are loaded through DefaultCredentialsProvider.
# Do not store AWS access keys or secret keys here.
# S3 Prefixes
aws.s3.daily_note/dms=${AWS_S3_DAILY_NOTE_DMS:daily_note/dms}
aws.s3.daily_note/dms/image=${AWS_S3_DAILY_NOTE_DMS_IMAGE:daily_note/dms/image}
aws.s3.daily_note/dms/doc=${AWS_S3_DAILY_NOTE_DMS_DOC:daily_note/dms/doc}

